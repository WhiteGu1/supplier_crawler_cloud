<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>供应商跨店比价系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="供应商比价">
  <style>
    :root {
      --bg: #0b1120;
      --bg-card: #151f32;
      --bg-input: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --primary-dark: #0284c7;
      --lowest: #10b981;
      --lowest-bg: rgba(16, 185, 129, 0.15);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --warning: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 10px 14px;
    }
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .logo {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
    }
    .logo span {
      background: linear-gradient(135deg, #38bdf8, #10b981);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--bg-input);
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 600;
      border: 1px solid var(--border);
    }
    .badge-status.online { background: var(--lowest-bg); color: #34d399; border-color: rgba(16, 185, 129, 0.4); }

    .search-row {
      margin-bottom: 8px;
      position: relative;
    }
    .search-input {
      width: 100%;
      height: 40px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0 34px 0 34px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    }
    .search-input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
      pointer-events: none;
    }
    .clear-icon {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: none;
    }

    .filters-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }
    .filters-bar::-webkit-scrollbar { display: none; }
    select, .pill-btn {
      height: 32px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      padding: 0 8px;
      outline: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .pill-btn.active {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
      font-weight: 600;
    }

    .container {
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
      padding: 10px 12px 30px 12px;
      flex: 1;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding: 0 2px;
    }

    /* 比价卡片网格 */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }
    @media (max-width: 640px) {
      .compare-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }
    }

    .compare-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.15s, border-color 0.15s;
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      padding-top: 100%;
      background: #0f172a;
      overflow: hidden;
      cursor: pointer;
    }
    .thumb-wrap img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.2s;
    }
    .thumb-wrap img:hover { transform: scale(1.05); }
    .no-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-size: 12px;
    }

    .compare-card.out-of-stock {
      opacity: 0.65;
    }
    .compare-card.out-of-stock:hover {
      opacity: 0.95;
    }

    .stock-badge {
      position: absolute;
      bottom: 8px;
      left: 8px;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      z-index: 2;
    }
    .stock-badge.in-stock { background: rgba(16, 185, 129, 0.88); color: #fff; }
    .stock-badge.out-stock { background: rgba(239, 68, 68, 0.88); color: #fff; }
    .stock-badge.pending { background: rgba(100, 116, 139, 0.88); color: #fff; }

    .sup-badge {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border);
      color: #cbd5e1;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      z-index: 2;
    }

    .card-info {
      padding: 10px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 6px;
    }
    .sku-line {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--primary);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .name-line {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.4;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 34px;
    }
    .price-box {
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-top: 4px;
      border-top: 1px dashed rgba(51, 65, 85, 0.6);
    }
    .price-val {
      font-family: var(--font-mono);
      font-size: 16px;
      font-weight: 700;
      color: #38bdf8;
    }
    .pkg-info {
      font-size: 11px;
      color: var(--text-muted);
    }

    .link-row {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }
    .link-btn {
      flex: 1;
      text-align: center;
      padding: 5px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #cbd5e1;
      font-size: 11px;
      text-decoration: none;
      transition: all 0.15s;
    }
    .link-btn:hover {
      background: var(--primary-dark);
      color: #fff;
    }

    .loader-wrap {
      text-align: center;
      padding: 50px 20px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .err-box {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: #fca5a5;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      display: none;
      font-size: 13px;
      line-height: 1.6;
    }

    .modal-preview {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-preview img {
      max-width: 100%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .top-left-badges {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      pointer-events: none;
      max-width: calc(100% - 16px);
    }
    .crawl-time-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.14);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 10px;
      line-height: 1.3;
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    @media (max-width: 640px) {
      .top-left-badges { top: 4px; left: 4px; gap: 3px; max-width: calc(100% - 8px); }
      .crawl-time-badge { font-size: 9px; padding: 1px 5px; }
    }
  </style>
</head>
<body>

<!-- 服务端数据直推槽位：页面随包到达，无需二次网络请求 -->
<div id="embedded-dat" style="display:none"><?= catalogData ?></div>

<header>
  <div class="header-top">
    <div class="logo">
      <span>⚖️ 供应商跨店比价系统</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <div id="status-badge" class="badge-status online">🟢 云端同步</div>
      <button class="pill-btn" onclick="openCloudModal()" title="云端同步与PDF解析">☁️ 云端更新</button>
      <button class="pill-btn" onclick="location.reload()" title="刷新比价">🔄 刷新</button>
    </div>
  </div>

  <div class="search-row">
    <span class="search-icon">🔍</span>
    <input type="text" class="search-input" id="search-input" placeholder="输入品名、SKU比价 (空格多词搜索)..." oninput="onSearchInput()">
    <span class="clear-icon" id="clear-btn" onclick="clearSearch()">✕</span>
  </div>

  <div class="filters-bar">
    <button class="pill-btn active" id="btn-avail-toggle" onclick="toggleInStockOnly()">🟢 仅看有货</button>
    <select id="select-sort" onchange="doFilter()">
      <option value="name_asc" selected>🔤 品名排序</option>
      <option value="price_asc">💰 价格：由低到高</option>
      <option value="price_desc">💰 价格：由高到低</option>
    </select>
    <select id="select-sup" onchange="doFilter()">
      <option value="">全部供应商 (18家)</option>
    </select>
    <select id="select-cat" onchange="doFilter()">
      <option value="">全部分类</option>
    </select>
  </div>
</header>

<main class="container">
  <div class="stats-bar">
    <span id="results-count">正在解密商品库...</span>
    <span id="cache-status" style="color:#64748b;">秒开直推模式</span>
  </div>

  <div class="err-box" id="err-box">
    <b>⚠️ 提示与状态</b><br>
    <div id="err-msg" style="margin-top:6px;">未知状态</div>
    <button class="pill-btn" style="margin-top:10px;background:var(--primary-dark);color:#fff;" onclick="location.reload()">🔄 重新加载</button>
  </div>

  <div class="compare-grid" id="compare-grid"></div>

  <div class="loader-wrap" id="loader-box">
    <div class="spinner"></div>
    <div id="loader-msg" style="font-weight:600;color:#e2e8f0;margin-bottom:6px;">正在本地解密 47,000+ 条跨店报价...</div>
    <div id="loader-submsg" style="font-size:12px;color:#94a3b8;">硬件加速秒开中 (约 0.1 秒)</div>
  </div>
</main>

<div id="cloud-modal" onclick="closeCloudModal()" style="display:none;position:fixed;inset:0;background:rgba(2,6,23,0.78);z-index:1000;align-items:center;justify-content:center;padding:16px;">
  <div onclick="event.stopPropagation()" style="width:100%;max-width:440px;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:18px;color:#f1f5f9;box-shadow:0 20px 50px rgba(0,0,0,0.5);">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <strong style="font-size:15px;">☁️ 云端自动化控制中心</strong>
      <button class="pill-btn" onclick="closeCloudModal()">✕ 关闭</button>
    </div>
    <div id="cloud-status-box" style="font-size:12px;color:#94a3b8;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;margin-bottom:12px;line-height:1.6;">正在读取云端状态...</div>
    <div style="margin-bottom:10px;">
      <label style="display:block;font-size:12px;color:#cbd5e1;margin-bottom:4px;">管理密码 (PIN)</label>
      <input id="cloud-pin-input" type="password" placeholder="默认 8888" style="width:100%;padding:8px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:13px;">
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
      <button class="pill-btn" style="flex:1;background:#0284c7;color:#fff;border-color:#0284c7;" onclick="triggerCloudCrawl()">🕷️ 云端抓取网页</button>
      <button class="pill-btn" style="flex:1;background:#0f766e;color:#fff;border-color:#0f766e;" onclick="triggerCloudPdf()">📄 解析Drive中PDF</button>
    </div>
    <div style="border-top:1px dashed #334155;padding-top:12px;margin-bottom:10px;">
      <div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;">📤 直接上传 PDF 报价单 (&lt;25MB; 大文件请直接拖入云盘「待解析PDF」目录)</div>
      <input id="cloud-pdf-hint" type="text" placeholder="可选：供应商提示 (如 Durax / Kandel / 留空自动识别)" style="width:100%;padding:7px 10px;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#f1f5f9;font-size:12px;margin-bottom:6px;">
      <input id="cloud-pdf-file" type="file" accept=".pdf,application/pdf" style="width:100%;font-size:12px;color:#cbd5e1;margin-bottom:8px;">
      <button class="pill-btn" style="width:100%;background:#7c3aed;color:#fff;border-color:#7c3aed;" onclick="uploadCloudPdf()">🚀 上传并自动解析入库</button>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">
      <button class="pill-btn" style="font-size:11px;" onclick="enablePdfWatchTrigger()">⏰ 开启每5分钟自动扫描PDF</button>
      <a id="cloud-inbox-link" href="#" target="_blank" rel="noopener" style="font-size:11px;color:#38bdf8;display:none;">打开 Drive 待解析目录 ↗</a>
    </div>
    <div id="cloud-action-msg" style="margin-top:10px;font-size:12px;color:#38bdf8;min-height:18px;word-break:break-all;"></div>
  </div>
</div>

<div class="modal-preview" id="modal-preview" onclick="this.style.display='none'">
  <img id="img-preview" src="" alt="原图预览">
</div>

<script>
window.onerror = function(msg, url, line) {
  const b = document.getElementById('err-box');
  const m = document.getElementById('err-msg');
  if (b && m) {
    b.style.display = 'block';
    m.innerHTML = '脚本异常: ' + msg + ' (行号: ' + line + ')';
  }
};

let CATALOG_DATA = null;
let SUP_MAP = new Map();
let FILTERED_ROWS = [];
let DISPLAY_LIMIT = 80;
let ONLY_IN_STOCK = true;

// 现代浏览器原生解压引擎 (基于 Web Streams DecompressionStream)
async function decompressGzip(b64Str) {
  const binaryString = atob(b64Str);
  const len = binaryString.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) {
    bytes[i] = binaryString.charCodeAt(i);
  }

  if (typeof DecompressionStream !== 'undefined') {
    const stream = new Response(bytes).body.pipeThrough(new DecompressionStream('gzip'));
    const text = await new Response(stream).text();
    return JSON.parse(text);
  }

  throw new Error('当前浏览器不支持原生流式解压，请使用 Chrome、Edge 或 Safari 浏览器访问');
}

async function boot() {
  const eb = document.getElementById('err-box');
  const lb = document.getElementById('loader-box');
  if (eb) eb.style.display = 'none';

  try {
    const el = document.getElementById('embedded-dat');
    // 只保留 Base64 合法字符，防止模板转义带入引号/空白
    const b64Data = (el ? el.textContent : '').replace(/[^A-Za-z0-9+/=]/g, '');

    if (!b64Data || b64Data.length < 100) {
      throw new Error('未获取到云端数据，请确认云盘中 catalog_db.dat 同步正常');
    }

    const payload = await decompressGzip(b64Data);
    applyCatalogPayload(payload);

    if (lb) lb.style.display = 'none';
    const cs = document.getElementById('cache-status');
    if (cs) cs.innerText = '✅ ' + (payload.rows ? payload.rows.length.toLocaleString() : '') + ' 件商品已就绪';
  } catch (err) {
    console.error('Init error:', err);
    if (lb) lb.style.display = 'none';
    if (eb) {
      eb.style.display = 'block';
      const m = document.getElementById('err-msg');
      if (m) m.innerText = '解密失败: ' + err.message;
    }
  }

  window.addEventListener('scroll', handleScroll);
}

function getAdjustedPrice(rawPrice, sid) {
  const p = Number(rawPrice) || 0;
  if (p <= 0) return 0;
  const sup = SUP_MAP.get(sid);
  const adj = sup && sup.adj ? Number(sup.adj) : 0;
  if (!adj) return p;
  const adjusted = Math.round(p * (1 + adj / 100) * 100) / 100;
  return adjusted > 0 ? adjusted : 0;
}

function applyCatalogPayload(payload) {
  CATALOG_DATA = payload;
  SUP_MAP.clear();
  (payload.suppliers || []).forEach(s => SUP_MAP.set(s.id, s));

  initFilterSelects();
  doFilter();
}

function initFilterSelects() {
  const supSelect = document.getElementById('select-sup');
  const catSelect = document.getElementById('select-cat');
  if (!CATALOG_DATA || !supSelect || !catSelect) return;

  const currentSup = supSelect.value;
  const currentCat = catSelect.value;

  const supCount = (CATALOG_DATA.suppliers || []).length;
  supSelect.innerHTML = '<option value="">全部供应商 (' + supCount + '家)</option>';
  (CATALOG_DATA.suppliers || []).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.id;
    opt.innerText = s.name + (s.adj ? ` (${s.adj > 0 ? '+' : ''}${s.adj}%)` : '');
    supSelect.appendChild(opt);
  });
  supSelect.value = currentSup;

  const catSet = new Set();
  (CATALOG_DATA.rows || []).forEach(r => {
    const cat = r[4];
    if (cat) catSet.add(cat);
  });
  catSelect.innerHTML = '<option value="">全部分类</option>';
  Array.from(catSet).sort().forEach(cat => {
    const opt = document.createElement('option');
    opt.value = cat;
    opt.innerText = cat;
    catSelect.appendChild(opt);
  });
  catSelect.value = currentCat;
}

function toggleInStockOnly() {
  ONLY_IN_STOCK = !ONLY_IN_STOCK;
  const btn = document.getElementById('btn-avail-toggle');
  if (btn) {
    if (ONLY_IN_STOCK) {
      btn.className = 'pill-btn active';
      btn.innerText = '🟢 仅看有货';
    } else {
      btn.className = 'pill-btn';
      btn.innerText = '⚪ 查看全部';
    }
  }
  doFilter();
}

function onSearchInput() {
  const val = document.getElementById('search-input').value.trim();
  const cb = document.getElementById('clear-btn');
  if (cb) cb.style.display = val ? 'block' : 'none';
  doFilter();
}

function clearSearch() {
  const si = document.getElementById('search-input');
  if (si) si.value = '';
  const cb = document.getElementById('clear-btn');
  if (cb) cb.style.display = 'none';
  doFilter();
}

const NAME_COLLATOR = typeof Intl !== 'undefined' && Intl.Collator
  ? new Intl.Collator(undefined, { sensitivity: 'base', numeric: true })
  : null;

function doFilter() {
  if (!CATALOG_DATA || !CATALOG_DATA.rows) return;

  const query = (document.getElementById('search-input')?.value || '').trim().toLowerCase();
  const supFilter = document.getElementById('select-sup')?.value || '';
  const catFilter = document.getElementById('select-cat')?.value || '';
  const sortMode = document.getElementById('select-sort')?.value || 'name_asc';

  const words = query ? query.split(/\s+/).filter(Boolean) : [];

  let matched = [];
  let totalCandidates = 0;
  let inStockCandidates = 0;

  const rows = CATALOG_DATA.rows;
  const total = rows.length;

  for (let i = 0; i < total; i++) {
    const r = rows[i];
    const sid = r[1];
    const sku = (r[2] || '').toLowerCase();
    const name = (r[3] || '').toLowerCase();
    const cat = r[4] || '';
    const avail = r[7];

    if (supFilter && String(sid) !== supFilter) continue;
    if (catFilter && cat !== catFilter) continue;

    if (words.length > 0) {
      const matchAll = words.every(w => sku.includes(w) || name.includes(w) || cat.toLowerCase().includes(w));
      if (!matchAll) continue;
    }

    totalCandidates++;
    if (avail === 1) inStockCandidates++;

    if (ONLY_IN_STOCK && avail !== 1) continue;

    matched.push(r);
  }

  if (sortMode === 'price_asc') {
    matched.sort((a, b) => {
      const pa = getAdjustedPrice(a[5], a[1]);
      const pb = getAdjustedPrice(b[5], b[1]);
      if (pa <= 0 && pb > 0) return 1;
      if (pb <= 0 && pa > 0) return -1;
      return pa - pb;
    });
  } else if (sortMode === 'price_desc') {
    matched.sort((a, b) => getAdjustedPrice(b[5], b[1]) - getAdjustedPrice(a[5], a[1]));
  } else if (sortMode === 'name_asc') {
    matched.sort((a, b) => {
      const na = a[3] || '';
      const nb = b[3] || '';
      return NAME_COLLATOR ? NAME_COLLATOR.compare(na, nb) : na.localeCompare(nb);
    });
  }

  FILTERED_ROWS = matched;
  DISPLAY_LIMIT = 80;

  const outOfStockCandidates = totalCandidates - inStockCandidates;
  const rc = document.getElementById('results-count');
  if (rc) {
    if (ONLY_IN_STOCK) {
      rc.innerText = `显示 ${matched.length.toLocaleString()} 条现货报价` + 
                     (outOfStockCandidates > 0 ? ` (已隐藏 ${outOfStockCandidates.toLocaleString()} 条缺货)` : '');
    } else {
      rc.innerText = `共 ${matched.length.toLocaleString()} 条报价 (现货 ${inStockCandidates.toLocaleString()} 条，缺货 ${outOfStockCandidates.toLocaleString()} 条)`;
    }
  }
  renderGrid();
}

function escAttr(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function renderTopLeftBadges(crawledAt) {
  const ts = crawledAt ? String(crawledAt).trim().slice(0, 16) : '';
  if (!ts) return '';
  const safeTs = escAttr(ts);
  return `<div class="top-left-badges"><time class="crawl-time-badge" datetime="${safeTs}" title="最后爬取时间: ${safeTs}">🕒 ${safeTs}</time></div>`;
}

function renderGrid() {
  const grid = document.getElementById('compare-grid');
  if (!grid) return;
  grid.innerHTML = '';

  const slice = FILTERED_ROWS.slice(0, DISPLAY_LIMIT);
  const frag = document.createDocumentFragment();

  slice.forEach((r) => {
    const pid = r[0];
    const sid = r[1];
    const sku = r[2] || '-';
    const name = r[3];
    const rawPrice = Number(r[5]) || 0;
    const price = getAdjustedPrice(rawPrice, sid);
    const pkg = r[6] || 1;
    const avail = r[7];
    const did = r[8];
    const httpImg = r[9];
    const purl = r[10];
    const crawledAt = r[11] || '';

    const supObj = SUP_MAP.get(sid) || { name: '供应商', adj: 0 };
    const supAdj = Number(supObj.adj) || 0;

    let thumbSrc = '';
    let fullImgSrc = '';
    if (did === '@r2' && CATALOG_DATA && CATALOG_DATA.r2_base) {
      const r2Url = CATALOG_DATA.r2_base + '/images/' + sid + '/p_' + pid + '.jpg';
      thumbSrc = r2Url;
      fullImgSrc = r2Url;
    } else if (did) {
      thumbSrc = 'https://drive.google.com/thumbnail?id=' + did + '&sz=w280';
      fullImgSrc = 'https://drive.google.com/thumbnail?id=' + did + '&sz=w1200';
    } else if (httpImg) {
      thumbSrc = httpImg;
      fullImgSrc = httpImg;
    }

    const isZeroPrice = !price || price <= 0;
    const priceDisplay = isZeroPrice 
      ? '<span style="color:#94a3b8;font-size:13px;font-weight:600;">暂无报价</span>'
      : '$' + price.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    const priceTitle = (!isZeroPrice && supAdj)
      ? `原价 $${rawPrice.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2})} (${supAdj > 0 ? '+' : ''}${supAdj}%)`
      : '';

    let stockBadgeText = '🟢 有现货';
    let stockBadgeClass = 'in-stock';
    if (avail !== 1 || isZeroPrice) {
      if (isZeroPrice) {
        stockBadgeClass = 'pending';
        stockBadgeText = '⚪ 待定价';
      } else {
        stockBadgeClass = 'out-stock';
        stockBadgeText = '🔴 缺货';
      }
    }

    const card = document.createElement('div');
    card.className = `compare-card ${(avail === 0 || isZeroPrice) ? 'out-of-stock' : ''}`;

    card.innerHTML = `
      <div class="thumb-wrap" onclick="previewImage('${fullImgSrc || ''}')">
        ${thumbSrc ? `<img src="${thumbSrc}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="${sku}">` : ''}
        <div class="no-img" style="${thumbSrc ? 'display:none;' : ''}">暂无图片</div>
        ${renderTopLeftBadges(crawledAt)}
        <div class="stock-badge ${stockBadgeClass}">
          ${stockBadgeText}
        </div>
        <div class="sup-badge">${supObj.name}</div>
      </div>
      <div class="card-info">
        <div class="sku-line">${sku}</div>
        <div class="name-line" title="${name}">${name}</div>
        <div class="price-box">
          <div class="price-val"${priceTitle ? ` title="${priceTitle}"` : ''}>${priceDisplay}</div>
          <div class="pkg-info">${pkg > 1 ? pkg + '个/包' : ''}</div>
        </div>
        ${purl ? `
          <div class="link-row">
            <a class="link-btn" href="${purl}" target="_blank" rel="noopener">🌐 进店查看</a>
          </div>
        ` : ''}
      </div>
    `;
    frag.appendChild(card);
  });

  grid.appendChild(frag);
}

function handleScroll() {
  if (DISPLAY_LIMIT >= FILTERED_ROWS.length) return;
  const scrollY = window.scrollY;
  const winHeight = window.innerHeight;
  const docHeight = document.documentElement.scrollHeight;
  if (scrollY + winHeight >= docHeight - 350) {
    DISPLAY_LIMIT += 60;
    renderGrid();
  }
}

function previewImage(src) {
  if (!src) return;
  const ip = document.getElementById('img-preview');
  const mp = document.getElementById('modal-preview');
  if (ip && mp) {
    ip.src = src;
    mp.style.display = 'flex';
  }
}

function setCloudMsg(text, isErr) {
  const el = document.getElementById('cloud-action-msg');
  if (!el) return;
  el.style.color = isErr ? '#fca5a5' : '#34d399';
  el.textContent = text || '';
}

function openCloudModal() {
  const m = document.getElementById('cloud-modal');
  if (!m) return;
  m.style.display = 'flex';
  setCloudMsg('');
  refreshCloudStatus();
}

function closeCloudModal() {
  const m = document.getElementById('cloud-modal');
  if (m) m.style.display = 'none';
}

function refreshCloudStatus() {
  const box = document.getElementById('cloud-status-box');
  if (!box) return;
  if (typeof google === 'undefined' || !google.script || !google.script.run) {
    box.textContent = '仅在已发布的 Google Apps Script WebApp 环境中可用。';
    return;
  }
  box.textContent = '正在检查 GitHub Actions 与 Drive 待解析PDF状态...';
  google.script.run
    .withSuccessHandler(function(st) {
      box.textContent =
        'GitHub 仓库: ' + (st.githubConfigured ? st.githubRepo + ' (已配置)' : '未配置 (需在 GAS 属性中设置 GITHUB_REPO & GITHUB_TOKEN)') +
        ' | 待解析PDF: ' + st.inboxPdfCount + ' 份' +
        ' | 自动巡检触发器: ' + (st.hasWatchTrigger ? '已开启 (每5分钟)' : '未开启');
      const lnk = document.getElementById('cloud-inbox-link');
      if (lnk && st.inboxFolderUrl) {
        lnk.href = st.inboxFolderUrl;
        lnk.style.display = 'inline';
      }
    })
    .withFailureHandler(function(err) {
      box.textContent = '状态读取失败: ' + (err && err.message ? err.message : err);
    })
    .getCloudControlStatus();
}

function getEnteredCloudPin() {
  const el = document.getElementById('cloud-pin-input');
  return el ? el.value.trim() : '';
}

function triggerCloudCrawl() {
  const pin = getEnteredCloudPin();
  setCloudMsg('正在向 GitHub Actions 发送网页爬取指令...');
  google.script.run
    .withSuccessHandler(function(res) { setCloudMsg(res.message, !res.ok); })
    .withFailureHandler(function(err) { setCloudMsg(err.message || String(err), true); })
    .adminTriggerCrawl(pin);
}

function triggerCloudPdf() {
  const pin = getEnteredCloudPin();
  setCloudMsg('正在向 GitHub Actions 发送 PDF 解析指令...');
  google.script.run
    .withSuccessHandler(function(res) { setCloudMsg(res.message, !res.ok); })
    .withFailureHandler(function(err) { setCloudMsg(err.message || String(err), true); })
    .adminTriggerPdf(pin);
}

function enablePdfWatchTrigger() {
  const pin = getEnteredCloudPin();
  setCloudMsg('正在注册每 5 分钟自动检查 Drive 待解析目录触发器...');
  google.script.run
    .withSuccessHandler(function(res) {
      setCloudMsg(res.message, !res.ok);
      refreshCloudStatus();
    })
    .withFailureHandler(function(err) { setCloudMsg(err.message || String(err), true); })
    .setupPdfWatchTrigger(pin);
}

function uploadCloudPdf() {
  const pin = getEnteredCloudPin();
  const fileEl = document.getElementById('cloud-pdf-file');
  const hintEl = document.getElementById('cloud-pdf-hint');
  if (!fileEl || !fileEl.files || !fileEl.files.length) {
    setCloudMsg('请先选择一份 PDF 文件', true);
    return;
  }
  const file = fileEl.files[0];
  if (file.size > 25 * 1024 * 1024) {
    setCloudMsg('文件超过 25MB，请直接拖入 Google Drive「待解析PDF」文件夹，5分钟内自动触发解析。', true);
    return;
  }
  setCloudMsg('正在上传 ' + file.name + ' 到 Google Drive...');
  const reader = new FileReader();
  reader.onload = function() {
    google.script.run
      .withSuccessHandler(function(res) {
        const msg = '已上传 ' + res.fileName + '；' + (res.dispatch && res.dispatch.message ? res.dispatch.message : '');
        setCloudMsg(msg, res.dispatch && !res.dispatch.ok);
        refreshCloudStatus();
      })
      .withFailureHandler(function(err) {
        setCloudMsg('上传失败: ' + (err.message || String(err)), true);
      })
      .uploadPdfToInbox(file.name, reader.result, hintEl ? hintEl.value : '', pin);
  };
  reader.readAsDataURL(file);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>

</body>
</html>
