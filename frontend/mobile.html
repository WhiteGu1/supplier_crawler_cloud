<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>商品数据库</title>
<link rel="stylesheet" href="/static/lightbox.css">
<script src="/static/lightbox.js"></script>
<style>
/* @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap'); */
:root{--bg:#0d1117;--bg2:#161b22;--bg3:#21262d;--border:#30363d;--accent:#00d4aa;--accent2:#3b82f6;--accent3:#f59e0b;--danger:#ef4444;--success:#22c55e;--text:#e6edf3;--text2:#8b949e;--text3:#6e7681;--radius:10px;--tab-h:56px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--tab-h) + var(--safe-bottom));overflow-x:hidden}
::-webkit-scrollbar{width:0;height:0}

/* Header */
.header{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px}
.header h1{font-size:16px;font-weight:700;flex:1}
.header .conn{width:8px;height:8px;border-radius:50%;background:var(--text3)}
/* price-mode-btn/mult-edit 已移除，固定零售价2.2 */

/* Tab Bar */
.tab-bar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--tab-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:200}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;color:var(--text3);cursor:pointer;transition:color .2s;-webkit-user-select:none;user-select:none}
.tab-item.active{color:var(--accent)}
.tab-item .tab-icon{font-size:22px;line-height:1}

/* Pages */
.page{display:none}.page.active{display:block}

/* Products Page */
.search-bar{padding:12px 16px;display:flex;gap:8px;position:sticky;top:52px;z-index:99;background:var(--bg)}
.search-bar input{flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:8px;font-size:14px;font-family:inherit;outline:none}
.search-bar input:focus{border-color:var(--accent)}
.search-bar select{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:10px 8px;border-radius:8px;font-size:13px;font-family:inherit;outline:none;max-width:100px}

.filter-row{padding:0 16px 8px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-row::-webkit-scrollbar{display:none}
.filter-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;white-space:nowrap}
.filter-chip.active{border-color:var(--accent);color:var(--accent);background:rgba(0,212,170,.1)}

/* Product Grid */
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 16px 16px}
.product-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.product-card:active{transform:scale(.97)}
.product-img{position:relative;width:100%;padding-top:100%;background:var(--bg3);overflow:hidden}
.product-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.product-img .placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:36px;color:var(--text3)}
.product-info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.product-name{font-weight:500;font-size:12px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:34px}
.product-price{color:var(--accent3);font-weight:700;font-size:15px;font-family:'JetBrains Mono',monospace}
.product-meta{font-size:10px;color:var(--text3)}
.product-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.btn{padding:7px 12px;border-radius:7px;border:none;cursor:pointer;font-size:12px;font-family:inherit;font-weight:500;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;-webkit-user-select:none;user-select:none}
.btn-primary{background:var(--accent);color:#0d1117}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-icon{width:32px;height:32px;padding:0;font-size:16px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.fav-btn{font-size:18px;background:none;border:none;cursor:pointer;padding:4px;color:var(--accent3)}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:16px;font-size:13px;color:var(--text2);flex-wrap:wrap}
.pagination .btn{min-width:60px}
.pagination .page-jump{display:flex;align-items:center;gap:4px;margin-left:4px}
.pagination .page-jump input{width:48px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 6px;border-radius:6px;font-size:12px;font-family:inherit;outline:none;text-align:center}
.pagination .page-jump input:focus{border-color:var(--accent)}
.pagination .page-info{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text3)}

/* Favorites Page */
.fav-tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fav-tabs::-webkit-scrollbar{display:none}
.fav-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.fav-header h2{font-size:16px;font-weight:600}
.fav-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px 16px}

/* Product Detail Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:300;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-sheet{background:var(--bg2);border-radius:16px 16px 0 0;width:100%;max-height:90vh;overflow-y:auto;padding:20px 16px calc(20px + var(--safe-bottom));animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.modal-close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:var(--bg3);border:none;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.detail-img{width:100%;aspect-ratio:1;background:var(--bg3);border-radius:12px;overflow:hidden;margin-bottom:16px;position:relative}
.detail-img img{width:100%;height:100%;object-fit:contain}
.detail-title{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:8px}
.detail-price{font-size:24px;font-weight:700;color:var(--accent3);font-family:'JetBrains Mono',monospace;margin-bottom:12px}
.detail-meta{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.detail-meta-item{display:flex;gap:8px;font-size:13px}
.detail-meta-label{color:var(--text3);min-width:60px}
.detail-meta-value{color:var(--text)}
.detail-actions{display:flex;gap:10px}
.detail-actions .btn{flex:1;padding:12px;font-size:14px}

/* Toast */
.toast-container{position:fixed;top:60px;left:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 16px;font-size:13px;box-shadow:0 4px 24px rgba(0,0,0,.4);animation:toastIn .25s ease;pointer-events:auto;text-align:center}
.toast.success{border-color:var(--success)}.toast.error{border-color:var(--danger)}.toast.info{border-color:var(--accent2)}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Loading */
.loading{display:flex;align-items:center;justify-content:center;padding:40px;color:var(--text3);font-size:14px;gap:8px}
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text3);gap:8px;text-align:center}
.empty .icon{font-size:48px;opacity:.4}

/* Badge */
.badge{display:inline-flex;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:500}
.badge-cat{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-sup{background:var(--bg3);color:var(--text3)}

/* Price filter */
.price-filter{display:flex;gap:8px;padding:0 16px 8px;align-items:center}
.price-filter input{width:80px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12px;font-family:inherit;outline:none;text-align:center}
.price-filter span{font-size:11px;color:var(--text3)}

/* Sort bar */
.sort-bar{display:flex;gap:6px;padding:0 16px 8px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.sort-bar::-webkit-scrollbar{display:none}
.sort-chip{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.sort-chip.active{border-color:var(--accent3);color:var(--accent3);background:rgba(245,158,11,.1)}
.card-top-badges{position:absolute;top:4px;left:4px;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:3px;pointer-events:none;max-width:calc(100% - 8px)}
.crawl-time-badge{display:inline-flex;align-items:center;gap:2px;background:rgba(15,23,42,.80);backdrop-filter:blur(4px);color:#e2e8f0;border:1px solid rgba(255,255,255,.14);font-variant-numeric:tabular-nums;font-size:9px;line-height:1.25;padding:1px 5px;border-radius:4px;white-space:nowrap}
.card-missing-badge{display:inline-block;background:rgba(239,68,68,.92);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;white-space:nowrap}
</style>
</head>
<body>

<div class="header">
  <span style="font-size:20px">📦</span>
  <h1 id="header-title">Catálogo de Productos</h1>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <button class="btn btn-sm btn-secondary" id="lang-btn" onclick="toggleLang()" style="padding:3px 8px;font-size:11px;font-weight:700">🌐 ES</button>
    <div class="conn" id="conn-dot"></div>
  </div>
</div>

<!-- Products Page -->
<div id="page-products" class="page active">
  <div class="search-bar">
    <input type="text" placeholder="Buscar por nombre o código..." id="kw" oninput="debounceSearch()">
    <select id="filter-sup" onchange="loadProducts()">
      <option value="" id="filter-sup-all">Todos los proveedores</option>
    </select>
  </div>
  <div class="filter-row" id="cat-filters"></div>
  <div class="price-filter">
    <input type="number" placeholder="Mín" id="filter-min" oninput="debounceSearch()">
    <span>—</span>
    <input type="number" placeholder="Máx" id="filter-max" oninput="debounceSearch()">
    <span id="product-total" style="flex:1;text-align:right;font-size:12px;color:var(--text3)"></span>
  </div>
  <div class="sort-bar">
    <div class="sort-chip active" data-sort="" onclick="setSort('')" id="sort-chip-def">Por defecto</div>
    <div class="sort-chip" data-sort="price_asc" onclick="setSort('price_asc')" id="sort-chip-pasc">Precio ↑</div>
    <div class="sort-chip" data-sort="price_desc" onclick="setSort('price_desc')" id="sort-chip-pdesc">Precio ↓</div>
    <div class="sort-chip" data-sort="name_asc" onclick="setSort('name_asc')" id="sort-chip-nasc">A-Z</div>
    <div class="sort-chip" data-sort="name_desc" onclick="setSort('name_desc')" id="sort-chip-ndesc">Z-A</div>
    <div class="sort-chip" id="btn-toggle-missing" onclick="toggleMobileShowMissing()" style="border-color:rgba(239,68,68,.4);color:var(--text2)">🚫 <span id="label-toggle-missing">Ver agotados</span></div>
  </div>
  <div id="product-grid" class="product-grid">
    <div class="loading" style="grid-column:1/-1"><div class="spinner"></div>Cargando...</div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<!-- Favorites Page -->
<div id="page-favorites" class="page">
  <div class="fav-header">
    <h2 id="fav-page-title">⭐ Mis Favoritos <span id="fav-count" style="font-size:13px;color:var(--text3);font-weight:400"></span></h2>
    <button class="btn btn-sm" id="btn-fav-clear" style="color:var(--danger);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)" onclick="clearAllFav()">Vaciar</button>
  </div>
  <div class="sort-bar">
    <div class="sort-chip active" data-favsort="" onclick="setFavSort('')" id="fav-sort-def">Por defecto</div>
    <div class="sort-chip" data-favsort="price_asc" onclick="setFavSort('price_asc')" id="fav-sort-pasc">Precio ↑</div>
    <div class="sort-chip" data-favsort="price_desc" onclick="setFavSort('price_desc')" id="fav-sort-pdesc">Precio ↓</div>
    <div class="sort-chip" data-favsort="name_asc" onclick="setFavSort('name_asc')" id="fav-sort-nasc">A-Z</div>
    <div class="sort-chip" data-favsort="name_desc" onclick="setFavSort('name_desc')" id="fav-sort-ndesc">Z-A</div>
  </div>
  <div class="fav-tabs" id="fav-tabs"></div>
  <div id="fav-grid" class="fav-grid"></div>
</div>

<!-- Cart Page -->
<div id="page-cart" class="page">
  <div class="fav-header">
    <h2 id="mobile-cart-title">🛒 Mi Carrito (0 u.)</h2>
    <div style="display:flex;gap:6px">
      <button class="btn btn-sm btn-secondary" id="btn-cart-toggle-missing" onclick="toggleMobileCartShowMissing()" style="font-size:11px;padding:4px 8px">🚫 <span id="label-cart-toggle-missing">Agotados</span></button>
      <button class="btn btn-sm btn-secondary" onclick="validateAndFixMobileCartQuantities()" style="font-size:11px;padding:4px 8px;color:var(--accent);border-color:rgba(0,212,170,.4)" title="Validar cantidades y bultos">⚡ Cant.</button>
      <button class="btn btn-sm btn-secondary" id="btn-cart-copy-top" onclick="copyMobileCartOrder()">Copiar</button>
      <button class="btn btn-sm" id="btn-cart-clear-top" style="color:var(--danger);background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3)" onclick="clearMobileCart()">Vaciar</button>
    </div>
  </div>
  <div class="fav-tabs" id="mobile-cart-tabs" style="padding:0 16px 10px;display:none"></div>
  <div id="mobile-cart-list" style="padding:0 16px 120px;display:flex;flex-direction:column;gap:14px"></div>
  <div id="mobile-cart-summary" style="position:fixed;bottom:calc(var(--tab-h) + var(--safe-bottom));left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:150">
    <div>
      <div style="font-size:11px;color:var(--text3)"><span id="mobile-cart-summary-label">Total</span> (<span id="mobile-cart-count">0</span> u.)</div>
      <div id="mobile-cart-total" style="font-size:18px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace">$0.00</div>
    </div>
    <div style="display:flex;gap:6px">
      <a id="mobile-cart-export-btn" href="/api/cart/export-xlsx?mode=retail&lang=es" class="btn btn-secondary btn-sm" style="text-decoration:none">📥 Exportar</a>
      <button class="btn btn-primary btn-sm" id="mobile-cart-copy-btn" onclick="copyMobileCartOrder()" style="font-weight:700">📋 Copiar</button>
    </div>
  </div>
</div>

<!-- Tab Bar -->
<div class="tab-bar">
  <div class="tab-item active" onclick="switchTab('products',this)">
    <span class="tab-icon">📦</span>
    <span id="tab-nav-products">Productos</span>
  </div>
  <div class="tab-item" onclick="switchTab('favorites',this)">
    <span class="tab-icon">⭐</span>
    <span id="tab-nav-favorites">Favoritos</span>
  </div>
  <div class="tab-item" onclick="switchTab('cart',this)" style="position:relative">
    <span class="tab-icon">🛒</span>
    <span id="tab-nav-cart">Carrito</span>
    <span id="mobile-cart-badge" style="display:none;position:absolute;top:3px;right:22%;background:var(--accent);color:#0d1117;font-weight:700;border-radius:10px;padding:0 5px;font-size:10px">0</span>
  </div>
</div>

<!-- Product Detail Modal -->
<div class="modal-overlay" id="detail-modal" onclick="if(event.target===this)closeDetail()">
  <div class="modal-sheet" style="position:relative">
    <button class="modal-close" onclick="closeDetail()" title="Cerrar">✕</button>
    <div class="modal-handle"></div>
    <div class="detail-img" id="detail-img"></div>
    <div class="detail-title" id="detail-title"></div>
    <div class="detail-price" id="detail-price"></div>
    <div class="detail-meta" id="detail-meta"></div>
    <!-- 移动端数量选择与自适应包装快捷键 -->
    <div id="mobile-detail-qty-box" style="background:var(--bg3);border-radius:10px;padding:12px;margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span style="font-size:12px;color:var(--text2);font-weight:600">🛒 购买数量:</span>
        <span id="mobile-detail-subtotal" style="font-size:14px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace">$0.00</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
        <button type="button" class="btn btn-secondary" onclick="adjustMobileDetailQty(-1)" style="width:36px;height:36px;font-size:16px;font-weight:700;padding:0">-</button>
        <input type="number" id="mobile-detail-qty" min="0" value="1" style="text-align:center;font-size:15px;font-weight:700;flex:1;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:6px;height:36px" oninput="updateMobileDetailSubtotal()">
        <button type="button" class="btn btn-secondary" onclick="adjustMobileDetailQty(1)" style="width:36px;height:36px;font-size:16px;font-weight:700;padding:0">+</button>
      </div>
      <div id="mobile-detail-quick-btns" style="display:flex;gap:6px;flex-wrap:wrap"></div>
    </div>
    <div class="detail-actions" id="detail-actions"></div>
  </div>
</div>

<!-- Mobile Cart Sync / Validate Result Modal -->
<div class="modal-overlay" id="mobile-sync-modal" onclick="if(event.target===this)closeMobileSyncModal()">
  <div class="modal-sheet" style="position:relative;max-height:85vh;overflow-y:auto">
    <button class="modal-close" onclick="closeMobileSyncModal()" title="Cerrar">✕</button>
    <div class="modal-handle"></div>
    <div id="mobile-sync-modal-title" style="font-size:16px;font-weight:700;margin-bottom:12px;color:var(--text)"></div>
    <div id="mobile-sync-modal-body"></div>
    <div id="mobile-sync-modal-actions" style="margin-top:16px;display:flex;gap:8px"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast-container" id="toasts"></div>

<script>
const API = location.origin;
let currentPage = 1;
const PAGE_SIZE = 20;
let totalProducts = 0;
let supplierAdjMap = {};
let _allCategories = [];
let _activeCat = '';
let _debounce = null;
let _favBySupplier = {};
let _sortVal = '';
let _favSortVal = '';

// 手机端固定零售价模式，倍率由电脑端配置同步，员工/顾客端不暴露倍率
const _priceMode = 'retail';
let _retailMult = 2.2;

// ============================================================
// 西班牙语 / 中文 国际化系统 (i18n)
// 默认严格适配阿根廷本地西班牙语（面向员工及客户）
// ============================================================
const I18N = {
  es: {
    app_title: 'Catálogo de Productos',
    lang_btn: '🌐 ES',
    search_placeholder: 'Buscar por nombre o código SKU...',
    all_suppliers: 'Todos los proveedores',
    all_categories: 'Todas las categorías',
    all: 'Todos',
    min_price: 'Mín',
    max_price: 'Máx',
    total_products: 'Total: {n} prod.',
    sort_default: 'Por defecto',
    sort_price_asc: 'Precio ↑',
    sort_price_desc: 'Precio ↓',
    sort_name_asc: 'A-Z',
    sort_name_desc: 'Z-A',
    loading: 'Cargando...',
    loading_cart: 'Cargando carrito...',
    no_products: 'No se encontraron productos',
    load_failed: 'Error al cargar datos',
    btn_detail: 'Detalles',
    btn_add_cart_title: 'Agregar al carrito',
    page_prev: '← Anterior',
    page_next: 'Siguiente →',
    page_jump_placeholder: 'Pág',
    page_jump_btn: 'Ir',
    enter_valid_page: 'Ingrese una página entre 1 y {n}',
    detail_title: 'Detalle del Producto',
    detail_price: 'Precio',
    detail_cat: 'Categoría',
    detail_sku: 'Código / SKU',
    detail_desc: 'Descripción',
    detail_add_cart_btn: '🛒 Agregar al carrito',
    detail_fav_btn: '☆ Guardar en favoritos',
    detail_fav_active: '⭐ En favoritos (quitar)',
    fav_title: '⭐ Mis Favoritos',
    fav_count: '{n} prod.',

    Object.keys(params).forEach(k => {

  }

}

// ============================================================
// API
// ============================================================
async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const r = await fetch(API + path, opts);
  if (!r.ok) throw new Error((await r.json().catch(()=>({}))).detail || r.statusText);
  return r.json();
}

// ============================================================
// Toast
// ============================================================
function showToast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

// Tab Navigation
// ============================================================
function switchTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  if (btn) btn.classList.add('active');
  if (name === 'products') loadProducts();
  if (name === 'favorites') loadFavorites();
  if (name === 'cart') loadMobileCart();
}

// ============================================================
// Supplier Adj Map
// ============================================================
async function loadSupplierAdjMap() {
  if (Object.keys(supplierAdjMap).length > 0) return;
  try {
    const list = await api('GET', '/api/suppliers');
    list.forEach(s => { supplierAdjMap[s.id] = s.price_adjustment || 0; });
  } catch(e) {}
}

function adjustedPrice(price, supplierId) {
  const adj = supplierAdjMap[supplierId] || 0;
  let p = parseFloat(price);
  if (adj) p = p * (1 + adj / 100);
  p = p * _retailMult; // 固定2.2倍率
  return p;
}

function updatePriceModeUI() {}

function togglePriceMode() {
  const activePage = document.querySelector('.page.active');
  if (activePage && activePage.id === 'page-products') loadProducts();
  else if (activePage && activePage.id === 'page-favorites') loadFavorites();
}

function escAttr(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function imgUrl(p) {
  if (p.image_local) return API + '/' + p.image_local.replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\//, '');
  if (p.image_url) return p.image_url.startsWith('http') ? p.image_url : API + p.image_url;
  return '';
}

function formatCrawlTimeShort(ts) {
  if (!ts) return '';
  return String(ts).trim().slice(0, 16);
}

function renderMobileTopBadges(p, missingText) {
  const timeStr = formatCrawlTimeShort(p && p.updated_at);
  const fullTs = escAttr((p && p.updated_at) ? String(p.updated_at) : '');
  const timeHtml = timeStr
    ? `<time class="crawl-time-badge" datetime="${fullTs}" title="最后爬取时间: ${fullTs}">🕒 ${escAttr(timeStr)}</time>`
    : '';
  const missHtml = (missingText && p && p.is_missing == 1)
    ? `<span class="card-missing-badge">${escAttr(missingText)}</span>`
    : '';
  if (!timeHtml && !missHtml) return '';
  return `<div class="card-top-badges">${timeHtml}${missHtml}</div>`;
}

let _favIdSet = new Set();

async function loadFavIds() {
  try {
    const res = await api('GET', '/api/favorites');
    _favIdSet = new Set((res.ids || []).map(Number));
  } catch(e) { _favIdSet = new Set(); }
}

function isFav(id) { return _favIdSet.has(Number(id)); }

async function toggleFav(id, btn) {
  id = Number(id);
  try {
    if (_favIdSet.has(id)) {
      await api('DELETE', '/api/favorites/' + id);
      _favIdSet.delete(id);
      if (btn) btn.textContent = '☆';
      showToast(_t('fav_removed'));
    } else {
      await api('POST', '/api/favorites/' + id);
      _favIdSet.add(id);
      if (btn) btn.textContent = '⭐';
      showToast(_t('fav_added'), 'success');
    }
  } catch(e) { showToast(_t('load_failed'), 'error'); }
}

async function loadFilters() {
  try {
    const list = await api('GET', '/api/suppliers');
    const sel = document.getElementById('filter-sup');
    sel.innerHTML = '<option value="" id="filter-sup-all">' + _t('all_suppliers') + '</option>' + list.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

    const cats = await api('GET', '/api/products/categories');
    _allCategories = cats || [];
    renderCatFilters();
  } catch(e) {}
}

function renderCatFilters() {
  const el = document.getElementById('cat-filters');
  const mains = [];
  const seen = {};
  _allCategories.forEach(c => {
    const main = c.split(' > ')[0].trim();
    if (!seen[main]) { seen[main] = true; mains.push(main); }
  });
  el.innerHTML = '<div class="filter-chip' + (!_activeCat ? ' active' : '') + '" onclick="setCat(\'\')">' + _t('all') + '</div>'
    + mains.map(m => `<div class="filter-chip${_activeCat===m?' active':''}" onclick="setCat('${m.replace(/'/g,"\\'")}')">${m}</div>`).join('');
}

function setCat(cat) {
  _activeCat = cat;
  currentPage = 1;
  renderCatFilters();
  loadProducts();
}

function setSort(val) {
  _sortVal = val;
  document.querySelectorAll('.sort-bar .sort-chip[data-sort]').forEach(c => {
    c.classList.toggle('active', c.dataset.sort === val);
  });
  currentPage = 1;
  loadProducts();
}

function debounceSearch() {
  clearTimeout(_debounce);
  _debounce = setTimeout(() => { currentPage = 1; loadProducts(); }, 350);
}

function toggleMobileShowMissing() {
  _mobileShowMissing = !_mobileShowMissing;
  const btn = document.getElementById('btn-toggle-missing');
  const label = document.getElementById('label-toggle-missing');
  if (btn) {
    if (_mobileShowMissing) {
      btn.style.background = 'rgba(239,68,68,.18)';
      btn.style.color = '#ef4444';
      btn.style.borderColor = '#ef4444';
    } else {
      btn.style.background = '';
      btn.style.color = 'var(--text2)';
      btn.style.borderColor = 'rgba(239,68,68,.4)';
    }

  }

async function loadProducts() {
  await loadSupplierAdjMap();
  const grid = document.getElementById('product-grid');
  grid.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>' + _t('loading') + '</div>';

  const kw = document.getElementById('kw').value;
  const sup = document.getElementById('filter-sup').value;
  const minP = parseFloat(document.getElementById('filter-min').value) || 0;
  const maxP = parseFloat(document.getElementById('filter-max').value) || Infinity;

  let url = `/api/products?page=${currentPage}&page_size=${PAGE_SIZE}`;
  if (kw) url += '&keyword=' + encodeURIComponent(kw);
  if (sup) url += '&supplier_id=' + sup;
  if (_activeCat) url += '&category=' + encodeURIComponent(_activeCat);
  if (_sortVal) url += '&sort=' + encodeURIComponent(_sortVal);
  if (_mobileShowMissing) url += '&include_missing=true';

  try {
    const res = await api('GET', url);
    totalProducts = res.total || 0;
    let rows = (res.data || []).filter(p => parseFloat(p.price) >= minP && parseFloat(p.price) <= maxP);

    document.getElementById('product-total').textContent = _t('total_products', { n: totalProducts });

    if (!rows.length) {
      grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="icon">📦</span><p>' + _t('no_products') + '</p></div>';
      document.getElementById('pagination').innerHTML = '';
      return;
    }

    grid.innerHTML = rows.map(p => {
      const img = imgUrl(p);
      const price = adjustedPrice(p.price, p.supplier_id).toFixed(2);
      const cat = p.category || '';
      const catParts = cat.split(' > ');
      const catHtml = catParts.length >= 2
        ? `<span class="badge badge-cat">${catParts[0].trim()}</span>`
        : (cat ? `<span class="badge badge-sup">${cat}</span>` : '');
      const isMissing = (p.is_missing == 1);
      const missingBadge = isMissing ? ' <span style="background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.35);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px">' + _t('out_of_stock') + '</span>' : '';
      const topBadges = renderMobileTopBadges(p, _t('out_of_stock'));
      const cardStyle = isMissing ? 'style="opacity:0.75;border-color:rgba(239,68,68,0.4)"' : '';
      return `<div class="product-card" onclick="viewDetail(${p.id})" ${cardStyle}>
        <div class="product-img product-zoomable-wrap" onclick="event.stopPropagation();previewProductImage(this)" data-img="${escAttr(img)}" data-title="${escAttr(p.name)}" data-sku="${escAttr(p.sku||'')}" title="点击查看大图">
          ${topBadges}
          ${img ? `<img src="${img}" loading="lazy">` : '<div class="placeholder">🖼</div>'}
          ${img ? `<div class="zoom-badge-hint">🔍</div>` : ''}
        </div>
        <div class="product-info">
          <div class="product-name">${p.name}${missingBadge}</div>
          <div class="product-price">$${price}</div>
          <div class="product-meta">${p.supplier_name || ''} ${catHtml}</div>
          <div class="product-actions">
            <button class="btn btn-secondary btn-sm" style="flex:1" onclick="event.stopPropagation();viewDetail(${p.id})">${_t('btn_detail')}</button>
            ${renderMobileCartBtnHtml(p.id, p.cart_qty)}
            <button class="fav-btn" id="fav-btn-${p.id}" onclick="event.stopPropagation();toggleFav(${p.id},this)">${isFav(p.id)?'⭐':'☆'}</button>
          </div>
        </div>
      </div>`;
    }).join('');

    renderPagination();
  } catch(e) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="icon">⚠️</span><p>' + _t('load_failed') + '</p></div>';
  }
}

function renderPagination() {
  const totalPages = Math.max(1, Math.ceil(totalProducts / PAGE_SIZE));
  const el = document.getElementById('pagination');
  el.innerHTML = `<button class="btn btn-secondary btn-sm" onclick="goPage(-1)" ${currentPage<=1?'disabled':''}>${_t('page_prev')}</button>
    <div class="page-info"><span id="page-current">${currentPage}</span> / <span id="page-total">${totalPages}</span></div>
    <button class="btn btn-secondary btn-sm" onclick="goPage(1)" ${currentPage>=totalPages?'disabled':''}>${_t('page_next')}</button>
    <div class="page-jump">
      <input type="number" id="page-jump-input" min="1" max="${totalPages}" placeholder="${_t('page_jump_placeholder')}" onkeydown="if(event.key==='Enter')jumpToPage()">
      <button class="btn btn-secondary btn-sm" onclick="jumpToPage()">${_t('page_jump_btn')}</button>
    </div>`;
}

function goPage(dir) {
  const totalPages = Math.max(1, Math.ceil(totalProducts / PAGE_SIZE));
  const target = currentPage + dir;
  if (target < 1 || target > totalPages) return;
  currentPage = target;
  loadProducts();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpToPage() {
  const totalPages = Math.max(1, Math.ceil(totalProducts / PAGE_SIZE));
  const input = document.getElementById('page-jump-input');
  const val = parseInt(input.value);
  if (isNaN(val) || val < 1 || val > totalPages) {
    showToast(_t('enter_valid_page', { n: totalPages }), 'error');
    return;
  }
  currentPage = val;
  loadProducts();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

    meta.innerHTML = metaList.map(([l, v]) => `<div class="detail-meta-item"><span class="detail-meta-label">${l}</span><span class="detail-meta-value">${v}</span></div>`).join('');

    const actions = document.getElementById('detail-actions');
    const isF = isFav(id);
    const favText = isF ? _t('detail_fav_active') : _t('detail_fav_btn');
    const favIcon = isF ? '⭐' : '☆';
    const detailCartQty = getMobileCartQty(id, p.cart_qty);
    var mobInput = document.getElementById('mobile-detail-qty');
    if (mobInput) {
      mobInput.value = detailCartQty > 0 ? detailCartQty : 1;
      renderMobileQuickBtns(p);
      updateMobileDetailSubtotal();
    }
    let html = `<button class="btn btn-primary" id="mobile-detail-cart-btn" data-detail-pid="${id}" onclick="confirmMobileDetailAddToCart()">${_t('detail_add_cart_btn')}${detailCartQty > 0 ? ' (' + detailCartQty + ')' : ''}</button>`;
    html += `<button class="btn btn-secondary" id="detail-fav-btn" onclick="toggleDetailFav(${id})">${favIcon} ${favText}</button>`;
    actions.innerHTML = html;

    document.getElementById('detail-modal').classList.add('open');
  } catch(e) { showToast(_t('load_failed'), 'error'); }
}

// ============================================================
// 移动端快捷加量与数量管理
// ============================================================
window.applyMobileQuickQtyAdd = function(addQty, isReset) {
  var input = document.getElementById('mobile-detail-qty');
  if (!input) return;
  if (isReset) {
    input.value = 0;
  } else {
    var cur = parseInt(input.value || 0, 10);
    if (isNaN(cur) || cur < 0) cur = 0;
    input.value = cur + addQty;
  }
  updateMobileDetailSubtotal();
};

window.adjustMobileDetailQty = function(delta) {
  var input = document.getElementById('mobile-detail-qty');
  if (!input) return;
  var cur = parseInt(input.value || 0, 10);
  if (isNaN(cur)) cur = 0;
  input.value = Math.max(0, cur + delta);
  updateMobileDetailSubtotal();
};

window.updateMobileDetailSubtotal = function() {
  if (!_currentProduct) return;
  var input = document.getElementById('mobile-detail-qty');
  var qty = parseInt(input.value || 0, 10);
  if (isNaN(qty) || qty < 0) qty = 0;
  var baseP = Number(_currentProduct.price) || 0;
  var adjP = adjustedPrice(baseP, _currentProduct.supplier_id);
  var sub = adjP * qty;
  var subEl = document.getElementById('mobile-detail-subtotal');
  if (subEl) {
    subEl.textContent = '$' + sub.toFixed(2);
  }
  var addBtn = document.getElementById('mobile-detail-cart-btn');
  if (addBtn) {
    addBtn.textContent = qty === 0 ? '设为 0 (移除)' : (_t('detail_add_cart_btn') + ' (' + qty + ')');
    if (qty === 0) {
      addBtn.className = 'btn btn-danger';
    } else {
      addBtn.className = 'btn btn-primary';
    }
  }
};

window.renderMobileQuickBtns = function(product) {
  var container = document.getElementById('mobile-detail-quick-btns');
  if (!container || !product) return;
  var pkg = parseInt(product.package_qty || 1, 10);
  var sub = parseInt(product.sub_pack_qty || 1, 10);

  function makeBtn(addQty, label, isReset, extraStyle) {
    extraStyle = extraStyle || '';
    if (isReset) {
      return '<button type="button" class="btn btn-danger btn-sm" onclick="applyMobileQuickQtyAdd(0, true)" style="font-size:11px;padding:3px 7px;' + extraStyle + '" title="设为0">0</button>';
    }
    return '<button type="button" class="btn btn-secondary btn-sm" onclick="applyMobileQuickQtyAdd(' + addQty + ', false)" style="font-size:11px;padding:3px 8px;font-weight:600;' + extraStyle + '">' + label + '</button>';
  }

  var btns = [makeBtn(0, '0', true)];
  if (pkg > 1 || sub > 1) {
    if (sub > 1 && sub < pkg) {
      btns.push(makeBtn(sub, '+' + sub + ' (1包)', false, 'border-color:rgba(59,130,246,.5);color:#60a5fa'));
      btns.push(makeBtn(pkg, '+' + pkg + ' (1盒/箱)', false, 'border-color:rgba(0,212,170,.5);color:var(--accent);font-weight:700'));
      btns.push(makeBtn(pkg * 2, '+' + (pkg * 2) + ' (2盒/箱)'));
      if (pkg * 5 <= 1000) btns.push(makeBtn(pkg * 5, '+' + (pkg * 5) + ' (5盒)'));
    } else if (pkg > 1) {
      btns.push(makeBtn(1, '+1'));
      btns.push(makeBtn(pkg, '+' + pkg + ' (1盒/箱)', false, 'border-color:rgba(0,212,170,.5);color:var(--accent);font-weight:700'));
      btns.push(makeBtn(pkg * 2, '+' + (pkg * 2) + ' (2盒/箱)'));
      if (pkg * 5 <= 1000) btns.push(makeBtn(pkg * 5, '+' + (pkg * 5) + ' (5盒)'));
    } else if (sub > 1) {
      btns.push(makeBtn(sub, '+' + sub + ' (1包)', false, 'border-color:rgba(59,130,246,.5);color:#60a5fa'));
      btns.push(makeBtn(sub * 2, '+' + (sub * 2) + ' (2包)'));
      if (sub * 5 <= 1000) btns.push(makeBtn(sub * 5, '+' + (sub * 5) + ' (5包)'));
    }
  } else {
    btns.push(makeBtn(1, '+1'));
    btns.push(makeBtn(6, '+6'));
    btns.push(makeBtn(12, '+12'));
    btns.push(makeBtn(24, '+24'));
    btns.push(makeBtn(48, '+48'));
  }
  container.innerHTML = btns.join(' ');
};

window.confirmMobileDetailAddToCart = async function() {
  if (!_currentProduct) return;
  var input = document.getElementById('mobile-detail-qty');
  var qty = parseInt(input.value || 0, 10);
  if (isNaN(qty) || qty < 0) qty = 0;
  var pid = _currentProduct.id;
  try {
    if (qty === 0) {
      await api('DELETE', '/api/cart/' + pid);
      _mobileCartItems = _mobileCartItems.filter(function(it) { return it.product_id !== pid; });
      showToast(_t('cart_removed_toast'));
    } else {
      await api('POST', '/api/cart', { product_id: pid, quantity: qty, mode: 'set' });
      var existing = _mobileCartItems.find(function(it) { return it.product_id === pid; });
      if (existing) {
        existing.quantity = qty;
      } else {
        await loadMobileCartItems();
      }
      showToast(_t('cart_added_toast'));
    }
    updateMobileCartBadge();
    refreshAllMobileCartButtons();
    closeDetail();
  } catch(e) {
    showToast(_t('load_failed') + ': ' + e.message, 'error');
  }
};

async function toggleDetailFav(id) {

}

function closeDetail() {

}

let _mobileFavAllProducts = [];
let _mobileFavActiveSup = '__all__';

async function loadFavorites() {
  await loadSupplierAdjMap();
  await loadFavIds();
  const ids = [..._favIdSet];
  document.getElementById('fav-count').textContent = ids.length ? _t('fav_count', { n: ids.length }) : '';

  const tabsEl = document.getElementById('fav-tabs');
  const gridEl = document.getElementById('fav-grid');

  if (!ids.length) {
    _mobileFavAllProducts = [];
    _favBySupplier = {};
    tabsEl.innerHTML = '';
    gridEl.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="icon">⭐</span><p>' + _t('fav_empty') + '</p><p style="font-size:12px;color:var(--text3)">' + _t('fav_empty_hint') + '</p></div>';
    return;
  }

  gridEl.innerHTML = '<div class="loading" style="grid-column:1/-1"><div class="spinner"></div>' + _t('loading') + '</div>';

  try {
    const res = await api('GET', '/api/products?product_ids=' + ids.join(','));
    _mobileFavAllProducts = res.data || [];
  } catch(e) {
    gridEl.innerHTML = '<div class="empty" style="grid-column:1/-1"><p>' + _t('load_failed') + '</p></div>';
    return;
  }

  _favBySupplier = {};
  _mobileFavAllProducts.forEach(p => {

  });

  renderFavTabs();
  renderFavCards();
}

function renderFavTabs() {
  const tabsEl = document.getElementById('fav-tabs');
  const suppliers = Object.keys(_favBySupplier).sort();
  if (!suppliers.length) { tabsEl.innerHTML = ''; return; }
  let html = `<div class="filter-chip${_mobileFavActiveSup==='__all__'?' active':''}" onclick="switchFavSup('__all__')">${_t('all')} (${_mobileFavAllProducts.length})</div>`;
  suppliers.forEach(s => {
    html += `<div class="filter-chip${s===_mobileFavActiveSup?' active':''}" onclick="switchFavSup('${s.replace(/'/g,"\\'")}')">${s} (${_favBySupplier[s].length})</div>`;
  });
  tabsEl.innerHTML = html;
}

function renderFavCards() {
  const gridEl = document.getElementById('fav-grid');
  let list = (_mobileFavActiveSup === '__all__')
    ? _mobileFavAllProducts.slice()
    : (_favBySupplier[_mobileFavActiveSup] || []).slice();

  if (_favSortVal === 'price_asc') {
    list.sort(function(a, b) { return adjustedPrice(a.price, a.supplier_id) - adjustedPrice(b.price, b.supplier_id); });
  } else if (_favSortVal === 'price_desc') {
    list.sort(function(a, b) { return adjustedPrice(b.price, b.supplier_id) - adjustedPrice(a.price, a.supplier_id); });
  } else if (_favSortVal === 'name_asc') {
    list.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });
  } else if (_favSortVal === 'name_desc') {
    list.sort(function(a, b) { return (b.name || '').localeCompare(a.name || ''); });
  }

  if (!list.length) {
    gridEl.innerHTML = '<div class="empty" style="grid-column:1/-1"><span class="icon">⭐</span><p>' + _t('fav_empty') + '</p></div>';
    return;
  }

  gridEl.innerHTML = list.map(p => {
    const img = imgUrl(p);
    const price = adjustedPrice(p.price, p.supplier_id).toFixed(2);
    const isMissing = (p.is_missing == 1);
    const missingBadge = isMissing ? ' <span style="background:rgba(239,68,68,.15);color:var(--danger);border:1px solid rgba(239,68,68,.35);font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px">' + _t('out_of_stock') + '</span>' : '';
    const topBadges = renderMobileTopBadges(p, _t('out_of_stock'));
    const cardStyle = isMissing ? 'style="opacity:0.75;border-color:rgba(239,68,68,0.4)"' : '';
    return `<div class="product-card" onclick="viewDetail(${p.id})" ${cardStyle}>
      <div class="product-img product-zoomable-wrap" onclick="event.stopPropagation();previewProductImage(this)" data-img="${escAttr(img)}" data-title="${escAttr(p.name)}" data-sku="${escAttr(p.sku||'')}" title="点击查看大图">
        ${topBadges}
        ${img ? `<img src="${img}" loading="lazy">` : '<div class="placeholder">🖼</div>'}
        ${img ? `<div class="zoom-badge-hint">🔍</div>` : ''}
      </div>
      <div class="product-info">
        <div class="product-name">${p.name}${missingBadge}</div>
        <div class="product-price">$${price}</div>
        <div class="product-meta">${p.supplier_name || ''}</div>
        <div class="product-actions">
          <button class="btn btn-secondary btn-sm" style="flex:1" onclick="event.stopPropagation();viewDetail(${p.id})">${_t('btn_detail')}</button>
          ${renderMobileCartBtnHtml(p.id, p.cart_qty)}
          <button class="fav-btn" onclick="event.stopPropagation();removeFav(${p.id})">⭐</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

window.switchFavSup = function(sup) {
  _mobileFavActiveSup = sup;
  renderFavTabs();
  renderFavCards();
};

window.setFavSort = function(val) {
  _favSortVal = val;
  document.querySelectorAll('.sort-bar .sort-chip[data-favsort]').forEach(c => {

async function removeFav(id) {
  id = Number(id);
  try {
    await api('DELETE', '/api/favorites/' + id);
    _favIdSet.delete(id);
    _mobileFavAllProducts = _mobileFavAllProducts.filter(p => p.id !== id);
    _favBySupplier = {};
    _mobileFavAllProducts.forEach(p => {
      const key = p.supplier_name || ('Proveedor ' + p.supplier_id);
      if (!_favBySupplier[key]) _favBySupplier[key] = [];
      _favBySupplier[key].push(p);
    });
    document.getElementById('fav-count').textContent = _mobileFavAllProducts.length ? _t('fav_count', { n: _mobileFavAllProducts.length }) : '';

async function clearAllFav() {
  if (!confirm(_t('fav_confirm_clear'))) return;

    await api('DELETE', '/api/favorites');
    _favIdSet.clear();
    _mobileFavAllProducts = [];
    _favBySupplier = {};
    loadFavorites();
    showToast(_t('fav_cleared'));
  } catch(e) { showToast(_t('load_failed'), 'error'); }
}

// ============================================================
// Mobile Cart System (支持按店家分类展示与分别计算总价)
// ============================================================
let _mobileCartItems = [];
let _mobileCartActiveSup = '__all__';

let _mobileCartQtyMap = {};

function getMobileCartQty(productId, fallbackQty) {
  const k = String(productId);
  if (Object.prototype.hasOwnProperty.call(_mobileCartQtyMap, k)) {
    return Number(_mobileCartQtyMap[k]) || 0;
  }
  return Number(fallbackQty) || 0;
}

function renderMobileCartBtnHtml(productId, fallbackQty) {
  const qty = getMobileCartQty(productId, fallbackQty);
  if (qty > 0) {
    return `<button class="btn btn-primary btn-sm" data-cart-btn="${productId}" style="padding:4px 8px;min-width:30px;justify-content:center;font-family:monospace;font-weight:700;font-size:12px" onclick="event.stopPropagation();promptAddToCart(${productId})" title="${_t('btn_add_cart_title')} (${qty})">${qty}</button>`;
  }
  return `<button class="btn btn-primary btn-sm" data-cart-btn="${productId}" style="padding:4px 8px;min-width:30px;justify-content:center" onclick="event.stopPropagation();promptAddToCart(${productId})" title="${_t('btn_add_cart_title')}">🛒</button>`;
}

function refreshAllMobileCartButtons() {
  document.querySelectorAll('button[data-cart-btn]').forEach(function(btn) {
    const pid = btn.getAttribute('data-cart-btn');
    const qty = getMobileCartQty(pid, 0);
    btn.style.minWidth = '30px';
    btn.style.justifyContent = 'center';
    if (qty > 0) {
      btn.style.fontFamily = 'monospace';
      btn.style.fontWeight = '700';
      btn.style.fontSize = '12px';
      btn.textContent = String(qty);
    } else {
      btn.style.fontFamily = '';
      btn.style.fontWeight = '';
      btn.style.fontSize = '';
      btn.textContent = '🛒';
    }
  });
  const detailBtn = document.getElementById('mobile-detail-cart-btn');
  if (detailBtn) {
    const dPid = detailBtn.getAttribute('data-detail-pid');
    const dQty = getMobileCartQty(dPid, 0);
    detailBtn.textContent = _t('detail_add_cart_btn') + (dQty > 0 ? ' (' + dQty + ')' : '');
  }
}

async function updateMobileCartBadge() {
  try {
    const res = await api('GET', '/api/cart/count');
    _mobileCartQtyMap = res.items_map || {};
    refreshAllMobileCartButtons();
    const badge = document.getElementById('mobile-cart-badge');
    if (!badge) return;
    const total = res.total_quantity || 0;
    if (total > 0) {
      badge.textContent = total > 99 ? '99+' : total;
      badge.style.display = 'inline-block';
    } else {
      badge.style.display = 'none';
    }
  } catch (e) {}
}

async function promptAddToCart(productId) {
  const curQty = getMobileCartQty(productId, 0);
  const defaultVal = curQty > 0 ? String(curQty) : '1';
  const qtyStr = prompt(_t('cart_prompt_qty') + (curQty > 0 ? ' (0 = eliminar/删除)' : ''), defaultVal);
  if (qtyStr === null) return;
  const qty = parseInt(qtyStr.trim(), 10);
  if (isNaN(qty) || qty < 0) {
    showToast(_t('cart_invalid_qty'), 'error');
    return;
  }
  try {
    await api('PUT', '/api/cart/' + productId, { quantity: qty });
    if (qty === 0) {
      showToast(_t('cart_removed_toast'), 'info');
    } else {
      showToast(_t('cart_added_toast', { n: qty }), 'success');
    }
    updateMobileCartBadge();
  } catch (e) {
    showToast(_t('load_failed') + ': ' + e.message, 'error');
  }
}

async function loadMobileCart() {
  await loadSupplierAdjMap();
  const listEl = document.getElementById('mobile-cart-list');
  listEl.innerHTML = '<div class="loading"><div class="spinner"></div>' + _t('loading_cart') + '</div>';

  try {
    const res = await api('GET', '/api/cart');
    _mobileCartItems = res.items || [];
    renderMobileCart();
    updateMobileCartBadge();
  } catch (e) {
    listEl.innerHTML = '<div class="empty"><span class="icon">⚠️</span><p>' + _t('load_failed') + '</p></div>';

let _mobileCartShowMissing = false;

function toggleMobileCartShowMissing() {

  updateMobileCartMissingBtn();

}

function updateMobileCartMissingBtn() {

    if (_mobileCartShowMissing) {
      btn.style.background = 'rgba(239,68,68,.18)';

function switchMobileCartSup(sup) {
  _mobileCartActiveSup = sup;
  renderMobileCart();
}

function renderMobileCart() {
  const listEl = document.getElementById('mobile-cart-list');
  const tabsEl = document.getElementById('mobile-cart-tabs');
  const titleEl = document.getElementById('mobile-cart-title');
  const countEl = document.getElementById('mobile-cart-count');
  const totalEl = document.getElementById('mobile-cart-total');
  const sumLabelEl = document.getElementById('mobile-cart-summary-label');
  const exportBtn = document.getElementById('mobile-cart-export-btn');

  const itemsToRender = _mobileCartShowMissing ? _mobileCartItems : _mobileCartItems.filter(it => it.is_missing != 1);
  const missingCount = _mobileCartItems.filter(it => it.is_missing == 1).length;

  if (!itemsToRender.length) {
    if (tabsEl) tabsEl.style.display = 'none';
    if (missingCount > 0 && !_mobileCartShowMissing) {
      listEl.innerHTML = '<div class="empty"><span class="icon">🛒</span><p>' + _t('cart_empty') + '</p><p style="font-size:12px;color:var(--text3);margin-top:6px">' + _t('cart_hidden_missing', { n: missingCount }) + '<br><a href="javascript:void(0)" onclick="toggleMobileCartShowMissing()" style="color:var(--accent);text-decoration:underline;display:inline-block;margin-top:8px">' + _t('toggle_missing_show') + '</a></p></div>';
    } else {
      listEl.innerHTML = '<div class="empty"><span class="icon">🛒</span><p>' + _t('cart_empty') + '</p></div>';
    }
    titleEl.textContent = _t('cart_title', { n: 0 }) + (!_mobileCartShowMissing && missingCount > 0 ? ' ' + _t('cart_hidden_missing', { n: missingCount }) : '');
    if (sumLabelEl) sumLabelEl.textContent = _t('cart_total_label');
    countEl.textContent = '0';
    totalEl.textContent = '$0.00';
    if (exportBtn) exportBtn.href = '/api/cart/export-xlsx?mode=retail&lang=' + _currentLang + '&include_missing=' + (_mobileCartShowMissing ? 'true' : 'false');
    return;
  }

  // 1. 按店家分组统计
  const grouped = {};
  let grandQty = 0;
  let grandTotal = 0;

  itemsToRender.forEach(item => {
    const sName = item.supplier_name || '未命名供应商';
    if (!grouped[sName]) {
      grouped[sName] = { totalQty: 0, totalAmount: 0, items: [] };
    }
    const qty = item.quantity || 1;
    const p = parseFloat(item.price) || 0;
    const adjP = adjustedPrice(p, item.supplier_id);
    const sub = adjP * qty;

    grouped[sName].totalQty += qty;
    grouped[sName].totalAmount += sub;
    grouped[sName].items.push({ item, adjP, sub, qty });

    grandQty += qty;
    grandTotal += sub;
  });

  const sups = Object.keys(grouped).sort();

  // 2. 渲染顶部店家切换标签（当有2家及以上店家时显示）
  if (sups.length > 1 && tabsEl) {
    tabsEl.style.display = 'flex';
    let tabsHtml = '<div class="filter-chip ' + (_mobileCartActiveSup === '__all__' ? 'active' : '') + '" onclick="switchMobileCartSup(\'__all__\')">' + _t('all') + ' ($' + grandTotal.toLocaleString('en-US', {maximumFractionDigits: 0}) + ')</div>';
    sups.forEach(s => {
      const st = grouped[s];
      const moneyStr = '$' + st.totalAmount.toLocaleString('en-US', {maximumFractionDigits: 0});
      tabsHtml += '<div class="filter-chip ' + (_mobileCartActiveSup === s ? 'active' : '') + '" onclick="switchMobileCartSup(\'' + s.replace(/'/g, "\\'") + '\')">🏪 ' + s + ' (' + st.totalQty + ' u. · ' + moneyStr + ')</div>';
    });
    tabsEl.innerHTML = tabsHtml;
  } else if (tabsEl) {
    tabsEl.style.display = 'none';
  }

  // 3. 确定要展示的店家列表
  const visibleSups = (_mobileCartActiveSup !== '__all__' && grouped[_mobileCartActiveSup]) ? [_mobileCartActiveSup] : sups;

  // 4. 渲染各店家分组卡片
  let fullHtml = '';
  visibleSups.forEach(sName => {
    const st = grouped[sName];
    const sEscaped = sName.replace(/'/g, "\\'");
    const supId = (st.items[0] && st.items[0].item) ? st.items[0].item.supplier_id : null;
    const isSyncSupported = [1, 2, 3, 4, 5, 18].includes(supId) || /sfpanda|diego|trapoman|benabi|osa|bella/i.test(sName);
    const isBella = (supId === 18) || /bella/i.test(sName);

}

async function changeMobileCartQty(productId, newQty) {
  if (newQty <= 0) {
    removeMobileCartItem(productId);
    return;
  }
  try {
    await api('PUT', '/api/cart/' + productId, { quantity: newQty });
    const it = _mobileCartItems.find(p => p.product_id === productId);
    if (it) it.quantity = newQty;
    renderMobileCart();
    updateMobileCartBadge();
  } catch (e) {
    showToast(_t('load_failed'), 'error');
  }
}

async function removeMobileCartItem(productId) {
  try {
    await api('DELETE', '/api/cart/' + productId);
    _mobileCartItems = _mobileCartItems.filter(p => p.product_id !== productId);
    renderMobileCart();
    updateMobileCartBadge();
    showToast(_t('cart_removed_toast'));
  } catch (e) {
    showToast(_t('load_failed'), 'error');
  }
}

async function clearMobileCart() {
  const isSpecific = (_mobileCartActiveSup !== '__all__');
  const confirmMsg = isSpecific ? _t('cart_confirm_clear_store', { name: _mobileCartActiveSup }) : _t('cart_confirm_clear_all');
  if (!confirm(confirmMsg)) return;

  try {
    if (isSpecific) {
      const toDelete = _mobileCartItems.filter(it => (it.supplier_name || '未命名供应商') === _mobileCartActiveSup);
      for (const it of toDelete) {
        await api('DELETE', '/api/cart/' + it.product_id);
      }
      _mobileCartItems = _mobileCartItems.filter(it => (it.supplier_name || '未命名供应商') !== _mobileCartActiveSup);
      _mobileCartActiveSup = '__all__';
    } else {
      await api('DELETE', '/api/cart');
      _mobileCartItems = [];
    }
    renderMobileCart();
    updateMobileCartBadge();
    showToast(_t('cart_cleared_toast'));
  } catch (e) {
    showToast(_t('load_failed') + ': ' + e.message, 'error');
  }
}

window.copyMobileBellaConsoleScript = function(targetSup) {
  var list = _mobileCartItems.filter(function(it) {
    var sup = it.supplier_name || '';
    return it.supplier_id === 18 || /bella/i.test(sup);
  });
  if (!_mobileCartShowMissing) {
    list = list.filter(function(it) { return it.is_missing != 1; });
  }

  if (!list.length) {
    showToast(_currentLang === 'es' ? 'No hay productos de Bella Central' : '购物车中无 Bella Central 商品', 'info');
    return;
  }

  var scriptItems = [];
  list.forEach(function(it) {
    var wcId = String(it.sku || '').trim();
    if (/^\d+$/.test(wcId)) {
      scriptItems.push({
        id: parseInt(wcId, 10),
        qty: parseInt(it.quantity || 1, 10),
        name: (it.name || '').trim().slice(0, 40),
        pkg: parseInt(it.package_qty || 1, 10),
        sub: parseInt(it.sub_pack_qty || 1, 10)
      });
    }
  });

  if (!scriptItems.length) {
    showToast('未能提取到 Bella Central 商品的网站数字 ID', 'error');
    return;
  }

  var jsonStr = JSON.stringify(scriptItems);
  var code = '(async () => {\n'
    + '  const items = ' + jsonStr + ';\n\n'
    + '  console.log(\'🚀 开始向 Bella Central 购物车导入 \' + items.length + \' 件商品 (先清空后导入)...\');\n'
    + '  let nonce = \'\';\n'
    + '  try {\n'
    + '    const cr = await fetch(\'/wp-json/wc/store/v1/cart\', { credentials: \'include\' });\n'
    + '    nonce = cr.headers.get(\'Nonce\') || \'\';\n'
    + '    if (cr.ok) {\n'
    + '      const cData = await cr.json();\n'
    + '      const existing = cData.items || [];\n'
    + '      if (existing.length > 0) {\n'
    + '        console.log(`🧹 检测到购物车已有 ${existing.length} 件商品，正在先清空旧商品...`);\n'
    + '        for (const ex of existing) {\n'
    + '          const rmRes = await fetch(\'/wp-json/wc/store/v1/cart/remove-item\', {\n'
    + '            method: \'POST\',\n'
    + '            headers: { \'Content-Type\': \'application/json\', \'Nonce\': nonce },\n'
    + '            credentials: \'include\',\n'
    + '            body: JSON.stringify({ key: ex.key })\n'
    + '          });\n'
    + '          const n = rmRes.headers.get(\'Nonce\');\n'
    + '          if (n) nonce = n;\n'
    + '        }\n'
    + '        console.log(\'✨ 旧购物车已彻底清空！准备开始导入新商品...\');\n'
    + '      }\n'
    + '    }\n'
    + '  } catch(e) {}\n\n'
    + '  let added = 0;\n'
    + '  let skipped = 0;\n'
    + '  let failed = 0;\n\n'
    + '  for (let i = 0; i < items.length; i++) {\n'
    + '    const it = items[i];\n'
    + '    try {\n'
    + '      let targetId = it.id;\n'
    + '      let targetQty = it.qty;\n'
    + '      let note = \'单品\';\n\n'
    + '      try {\n'
    + '        const pr = await fetch(`/wp-json/wc/store/v1/products/${it.id}`);\n'
    + '        if (pr.ok) {\n'
    + '          const prod = await pr.json();\n'
    + '          if (prod.is_in_stock === false) {\n'
    + '            console.warn(`[${i + 1}/${items.length}] ❌ 售罄断货已跳过: ${it.name}`);\n'
    + '            skipped++;\n'
    + '            continue;\n'
    + '          }\n'
    + '          if (prod.type === \'variable\' && prod.variations && prod.variations.length > 0) {\n'
    + '            const vars = prod.variations.map(v => {\n'
    + '              const val = (v.attributes && v.attributes[0] ? v.attributes[0].value : \'\').toLowerCase();\n'
    + '              const m = val.match(/\\d+/);\n'
    + '              return { id: v.id, val: val, count: m ? parseInt(m[0], 10) : 1 };\n'
    + '            });\n'
    + '            let chosen = vars.find(v => v.count === it.pkg && it.qty % it.pkg === 0);\n'
    + '            if (!chosen && it.sub > 1) chosen = vars.find(v => v.count === it.sub && it.qty % it.sub === 0);\n'
    + '            if (!chosen) chosen = vars.find(v => v.count > 1 && it.qty % v.count === 0);\n'
    + '            if (!chosen) chosen = vars.find(v => v.count === 1) || vars[0];\n'
    + '            if (chosen) {\n'
    + '              targetId = chosen.id;\n'
    + '              targetQty = (chosen.count > 1 && it.qty >= chosen.count && it.qty % chosen.count === 0) ? (it.qty / chosen.count) : it.qty;\n'
    + '              note = `${chosen.val || chosen.id} x ${targetQty}`;\n'
    + '            }\n'
    + '          }\n'
    + '        }\n'
    + '      } catch(e) {}\n\n'
    + '      const res = await fetch(\'/wp-json/wc/store/v1/cart/add-item\', {\n'
    + '        method: \'POST\',\n'
    + '        headers: { \'Content-Type\': \'application/json\', \'Nonce\': nonce },\n'
    + '        credentials: \'include\',\n'
    + '        body: JSON.stringify({ id: targetId, quantity: targetQty })\n'
    + '      });\n'
    + '      const nextNonce = res.headers.get(\'Nonce\');\n'
    + '      if (nextNonce) nonce = nextNonce;\n\n'
    + '      if (res.ok) {\n'
    + '        added++;\n'
    + '        console.log(`[${i + 1}/${items.length}] ✅ 加购成功 (${note}): ${it.name}`);\n'
    + '      } else {\n'
    + '        const err = await res.json().catch(() => ({}));\n'
    + '        console.warn(`[${i + 1}/${items.length}] ⚠️ 加购受阻: ${it.name}`, err.message || res.statusText);\n'
    + '        failed++;\n'
    + '      }\n'
    + '    } catch(err) {\n'
    + '      console.error(`[${i + 1}/${items.length}] ❌ 异常: ${it.name}`, err);\n'
    + '      failed++;\n'
    + '    }\n'
    + '    await new Promise(r => setTimeout(r, 60));\n'
    + '  }\n\n'
    + '  console.log(`🎉 导入执行完毕！成功: ${added}, 缺货跳过: ${skipped}, 失败: ${failed}`);\n'
    + '  alert(`🎉 成功将 ${added} / ${items.length} 件商品加入 Bella Central 购物车！(缺货 ${skipped} 件)\\n点击确定跳转查看。`);\n'
    + '  location.href = \'/carro/\';\n'
    + '})();';

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(function() {
      showToast(_currentLang === 'es' ? '¡Código copiado al portapapeles!' : '📋 已复制导入代码 (' + scriptItems.length + '件商品)！', 'success');
    });
  } else {
    var ta = document.createElement('textarea');
    ta.value = code;
    ta.style.position = 'fixed';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(_currentLang === 'es' ? '¡Código copiado al portapapeles!' : '📋 已复制导入代码 (' + scriptItems.length + '件商品)！', 'success');
  }
};

function copyMobileCartOrder(targetSup) {
  if (!_mobileCartItems.length) {
    showToast(_t('cart_empty'), 'info');
    return;
  }
  const supToCopy = (typeof targetSup === 'string' && targetSup && targetSup !== '__all__') 
    ? targetSup 
    : (_mobileCartActiveSup !== '__all__' ? _mobileCartActiveSup : null);

  let items = supToCopy 
    ? _mobileCartItems.filter(it => (it.supplier_name || '未命名供应商') === supToCopy)
    : _mobileCartItems;

  if (!_mobileCartShowMissing) {
    items = items.filter(it => it.is_missing != 1);
  }

  if (!items.length) {
    showToast(_t('cart_empty'), 'info');
    return;
  }

  const isEs = (_currentLang === 'es');
  const today = new Date().toLocaleDateString(isEs ? 'es-AR' : 'zh-CN');
  let text = '';
  if (isEs) {
    text = supToCopy ? ('【Pedido: ' + supToCopy + '】\n') : '【Presupuesto de Venta / Pedido】\n';
    text += 'Fecha: ' + today + '\n';
    text += '----------------------------------------\n';
    text += 'CÓDIGO\tCANT\tPRECIO(ARS)\tSUBTOTAL(ARS)\tDESCRIPCIÓN\n';
  } else {
    text = supToCopy ? ('【' + supToCopy + ' 订货清单】\n') : '【订货清单】\n';
    text += '日期: ' + today + '\n';
    text += '----------------------------------------\n';
    text += 'SKU\t数量\t单价(ARS)\t小计(ARS)\t商品名称\n';
  }

  let totalQty = 0;
  let totalAmount = 0;
  items.forEach(it => {
    const qty = it.quantity || 1;
    const p = parseFloat(it.price) || 0;
    const adjP = adjustedPrice(p, it.supplier_id);
    const sub = adjP * qty;
    totalQty += qty;
    totalAmount += sub;
    const pStr = p <= 0 ? (isEs ? 'A consultar' : 'CONSULTAR') : adjP.toFixed(2);
    const subStr = p <= 0 ? (isEs ? 'A consultar' : '待询价') : sub.toFixed(2);
    const missingTag = (it.is_missing == 1) ? (isEs ? ' [AGOTADO]' : ' [已缺货]') : '';
    text += `${it.sku || '-'}	${qty}	$${pStr}	$${subStr}	${it.name}${missingTag}\n`;
  });
  text += '----------------------------------------\n';
  if (isEs) {
    text += `Total productos: ${items.length}\n`;
    text += `Total unidades: ${totalQty}\n`;
    text += `Total general: $${totalAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ARS`;
  } else {
    text += `品种数: ${items.length} 种\n`;
    text += `总件数: ${totalQty} 件\n`;
    text += `总计: $${totalAmount.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ARS`;
  }

  navigator.clipboard.writeText(text).then(() => {
    showToast(supToCopy ? _t('cart_order_store_copied', { name: supToCopy }) : _t('cart_order_copied'), 'success');
  }).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast(supToCopy ? _t('cart_order_store_copied', { name: supToCopy }) : _t('cart_order_copied'), 'success');
  });
}

        + '<div style="min-width:0;flex:1;margin-right:8px">'
        + '<div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + it.name + '</div>'
        + '<div style="color:var(--text3);font-size:10px">' + it.supplier_name + ' · Mín: ' + it.min_qty + ' · Bulto: ' + it.package_qty + '</div>'
        + '</div>'
        + '<div style="text-align:right;flex-shrink:0">'
        + '<s style="color:#ef4444">' + it.old_quantity + '</s> → <b style="color:#22c55e">' + it.new_quantity + '</b>'
        + '</div>'
        + '</div>';
    });
    html += '</div>';

    bodyEl.innerHTML = html;
    actEl.innerHTML = '<button class="btn btn-secondary" style="flex:1" onclick="closeMobileSyncModal()">' + (isEs ? 'Cancelar' : '取消') + '</button>'
      + '<button class="btn btn-primary" style="flex:1;font-weight:700" onclick="confirmMobileAutoFix()">' + (isEs ? '⚡ Ajustar todo' : '⚡ 一键规整') + '</button>';

    modal.classList.add('open');
  } catch(e) {
    showToast(_t('load_failed'), 'error');
  }
}

async function confirmMobileAutoFix() {
  try {
    const res = await api('POST', '/api/cart/validate-quantities', { auto_fix: true });
    closeMobileSyncModal();
    showToast(_currentLang === 'es' ? '¡' + res.fixed_count + ' productos ajustados!' : '已规整 ' + res.fixed_count + ' 件商品！', 'success');
    renderMobileCart();
    updateMobileCartBadge();
  } catch(e) {
    showToast(_t('load_failed'), 'error');
  }
}

async function syncMobileSupplierCart(supplierId, supplierName) {
  const btn = document.getElementById('btn-mobile-sync-' + supplierId);
  const origText = btn ? btn.innerHTML : '';
  if (btn) {
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> ' + _t('cart_syncing');
  }

  const isEs = (_currentLang === 'es');
  try {
    showToast(isEs ? 'Enviando a la web de ' + supplierName + '...' : '正在同步至 ' + supplierName + '...', 'info');
    const res = await api('POST', '/api/cart/sync/' + supplierId, { auto_adjust: true });

    const modal = document.getElementById('mobile-sync-modal');
    const titleEl = document.getElementById('mobile-sync-modal-title');
    const bodyEl = document.getElementById('mobile-sync-modal-body');
    const actEl = document.getElementById('mobile-sync-modal-actions');

    titleEl.textContent = '🛒 ' + supplierName;

    let html = '';
    if (res.success) {
      html += '<div style="background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);border-radius:10px;padding:12px;margin-bottom:12px;text-align:center">'
        + '<div style="font-size:24px;margin-bottom:4px">🎉</div>'
        + '<div style="font-size:14px;font-weight:700;color:#22c55e">' + res.message + '</div>'
        + '</div>';
    } else {
      html += '<div style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);border-radius:10px;padding:12px;margin-bottom:12px;text-align:center">'
        + '<div style="font-size:24px;margin-bottom:4px">⚠️</div>'
        + '<div style="font-size:13px;font-weight:700;color:#ef4444">' + res.message + '</div>'
        + '</div>';
    }

    if (res.adjusted_items && res.adjusted_items.length > 0) {
      html += '<div style="margin-bottom:10px">'
        + '<div style="font-size:11px;font-weight:700;color:#f59e0b;margin-bottom:4px">' + (isEs ? 'Ajustados por bulto/mínimo:' : '按起订量/箱规规整:') + '</div>'
        + '<div style="max-height:90px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;background:var(--bg3);border-radius:6px;padding:6px">';
      res.adjusted_items.forEach(it => {
        html += '<div style="font-size:10px;display:flex;justify-content:space-between;color:var(--text2)">'
          + '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px">' + it.name + '</span>'
          + '<span>' + it.old_quantity + ' → <b style="color:#22c55e">' + it.new_quantity + '</b></span>'
          + '</div>';
      });
      html += '</div></div>';
    }

    if (res.failed_items && res.failed_items.length > 0) {
      html += '<div style="margin-bottom:10px">'
        + '<div style="font-size:11px;font-weight:700;color:#ef4444;margin-bottom:4px">' + (isEs ? 'No agregados:' : '未能添加:') + '</div>'
        + '<div style="max-height:100px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;background:var(--bg3);border-radius:6px;padding:6px">';
      res.failed_items.forEach(it => {
        html += '<div style="font-size:10px;display:flex;justify-content:space-between;color:var(--text2);gap:4px">'
          + '<span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1">' + it.name + '</span>'
          + '<span style="color:#ef4444;flex-shrink:0">' + it.reason + '</span>'
          + '</div>';
      });
      html += '</div></div>';
    }

    bodyEl.innerHTML = html;

    let actionsHtml = '<button class="btn btn-secondary" style="flex:1" onclick="closeMobileSyncModal()">' + (isEs ? 'Cerrar' : '关闭') + '</button>';
    if (res.cart_url) {
      actionsHtml += '<a href="' + res.cart_url + '" target="_blank" class="btn btn-primary" style="flex:1;background:#2563eb;border-color:#2563eb;color:#fff;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700"><span>🔗</span> ' + _t('cart_sync_open_web') + '</a>';
    }
    actEl.innerHTML = actionsHtml;

    modal.classList.add('open');
    if (res.adjusted_items && res.adjusted_items.length > 0) {
      renderMobileCart();
    }
  } catch(e) {
    showToast(_t('load_failed'), 'error');
  } finally {
    if (btn) {
      btn.disabled = false;
      btn.innerHTML = origText;
    }
  }
}

function closeMobileSyncModal() {
  const modal = document.getElementById('mobile-sync-modal');
  if (modal) modal.classList.remove('open');
}

// ============================================================
// Multiplier from Backend
// ============================================================
async function loadMobileMultiplier() {
  try {
    const res = await api('GET', '/api/settings/mobile-multiplier');
    if (res && res.multiplier) {
      _retailMult = parseFloat(res.multiplier) || 2.2;
    }
  } catch(e) {}
}

document.addEventListener('visibilitychange', function() {
  if (document.visibilityState === 'visible') {
    loadMobileMultiplier().then(() => {
      const active = document.querySelector('.page.active');
      if (active && active.id === 'page-products') loadProducts();
      else if (active && active.id === 'page-favorites') loadFavorites();
      else if (active && active.id === 'page-cart') renderMobileCart();
    });
  }
});

// ============================================================
// Init
// ============================================================
async function init() {
  updateStaticUI();
  try {
    await api('GET', '/api/dashboard');
    document.getElementById('conn-dot').style.background = 'var(--success)';
  } catch(e) {
    document.getElementById('conn-dot').style.background = 'var(--danger)';
    showToast(_t('backend_offline'), 'error');
  }
  localStorage.removeItem('product_favorites');
  await loadMobileMultiplier();
  await loadFavIds();
  await updateMobileCartBadge();
  loadFilters();
  loadProducts();
}

init();
</script>
</body>
</html>
